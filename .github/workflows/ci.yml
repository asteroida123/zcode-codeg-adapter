name: Adapter contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.16.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm run test:mutations
      - run: npm run probe:backend
      - name: Install locked upstream (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:upstream
      - name: Verify published file set includes the dependency lock
        shell: bash
        run: |
          npm pack --dry-run --ignore-scripts --json > pack-manifest.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const files = JSON.parse(fs.readFileSync('pack-manifest.json'))[0].files.map(f => f.path); for (const p of ['bin/zcode-codeg.js', 'src/launcher.js', 'npm-shrinkwrap.json']) assert.ok(files.includes(p), p);"
